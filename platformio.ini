[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ILI9341          ; Actualizado según el esquemático
    adafruit/Adafruit BME280 Library   ; Reemplaza al DHT
    adafruit/Adafruit Unified Sensor
    knolleary/PubSubClient